<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Chat</title>
<style>
  :root {
    --bg: #0e1014; --panel: #161a21; --line: #262c37; --text: #e8ebf0; --dim: #8b94a5;
    --accent: #4fd1c5; --user: #1f2633; --danger: #f2617a;
    --bn: "Noto Sans Bengali", "Nirmala UI", "Vrinda", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.55 "Segoe UI", system-ui, var(--bn); display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; font-weight: 600; margin: 0; white-space: nowrap; }
  #status { font-size: 13px; color: var(--dim); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header select, header button { white-space: nowrap; flex: none; }
  #status b { color: var(--accent); font-weight: 500; }
  select, button { font: inherit; color: inherit; }
  select, .ghost { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  .ghost:hover, select:hover { border-color: #3a4353; }
  main { flex: 1; overflow-y: auto; padding: 24px 16px; }
  #log { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  .msg { padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; max-width: 88%; }
  .user { align-self: flex-end; background: var(--user); }
  .bot { align-self: flex-start; padding-left: 0; }
  .bot.speaking { border-left: 2px solid var(--accent); padding-left: 12px; border-radius: 0; }
  #voice[aria-pressed="false"] { color: var(--dim); }
  .fix { margin-left: 8px; background: none; border: 0; padding: 0; color: var(--accent); font: inherit;
         font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .fix:hover { color: var(--text); }
  .meta { display: block; font-size: 12px; color: var(--dim); margin-top: 4px; }
  .empty { color: var(--dim); text-align: center; margin-top: 18vh; }
  .empty kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; font: inherit; font-size: 13px; }
  footer { border-top: 1px solid var(--line); padding: 14px 16px 18px; }
  #bar { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #text { flex: 1; resize: none; background: var(--panel); color: var(--text); border: 1px solid var(--line);
          border-radius: 12px; padding: 11px 14px; font: inherit; max-height: 160px; }
  #text:focus { outline: none; border-color: var(--accent); }
  #mic { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel);
         cursor: pointer; display: grid; place-items: center; flex: none; transition: background .15s, border-color .15s; }
  #mic svg { width: 22px; height: 22px; fill: var(--text); }
  #mic.rec { background: var(--danger); border-color: var(--danger); animation: pulse 1.2s ease-in-out infinite; }
  #mic:disabled, #send:disabled { opacity: .45; cursor: default; }
  #send { height: 48px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--accent); color: #062421; font-weight: 600; cursor: pointer; }
  #level { max-width: 780px; margin: 8px auto 0; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  #level i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .08s linear; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 9px rgba(242, 97, 122, .18); } }
  @media (prefers-reduced-motion: reduce) { #mic.rec { animation: none; } }
</style>
</head>
<body>
<header>
  <h1>Voice Chat</h1>
  <span id="status">starting…</span>
  <select id="lang" title="Language you will speak">
    <option value="auto">Auto (English / বাংলা)</option>
    <option value="en">English</option>
    <option value="bn">বাংলা</option>
  </select>
  <button class="ghost" id="voice" title="Speak the replies aloud" aria-pressed="true">🔊 Voice on</button>
  <button class="ghost" id="new">New chat</button>
</header>
<main id="scroll">
  <div id="log"><p class="empty" id="empty">Click the microphone or hold <kbd>Space</kbd>, speak in English or Bangla, then release.<br>Your words appear as text and the local model replies.</p></div>
</main>
<footer>
  <div id="bar">
    <button id="mic" title="Click to talk (or hold Space)" aria-label="Record">
      <svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a.9.9 0 0 0-1.8 0 4.2 4.2 0 0 1-8.4 0 .9.9 0 0 0-1.8 0 6 6 0 0 0 5.1 5.9V20H8.9a.9.9 0 0 0 0 1.8h6.2a.9.9 0 0 0 0-1.8h-2.2v-2.6a6 6 0 0 0 5.1-5.9Z"/></svg>
    </button>
    <textarea id="text" rows="1" placeholder="…or type a message"></textarea>
    <button id="send">Send</button>
  </div>
  <div id="level"><i></i></div>
</footer>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), scroller = $('scroll'), mic = $('mic'), statusEl = $('status');
let busy = false, rec = null;

function setStatus(html) { statusEl.innerHTML = html; }
function add(cls, text) {
  $('empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  log.appendChild(el);
  scroller.scrollTop = scroller.scrollHeight;
  return el;
}
function meta(el, text) {
  const m = document.createElement('span');
  m.className = 'meta';
  m.textContent = text;
  el.appendChild(m);
}
function setBusy(b) { busy = b; mic.disabled = b && !rec; $('send').disabled = b; }

async function refreshStatus() {
  try {
    const s = await (await fetch('/api/status')).json();
    const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const stt = s.stt_ready ? `<b>hearing ready</b> (${esc(s.stt)})`
      : s.stt_error ? `speech models failed: ${esc(s.stt_error)} — close Voice Chat and start it again`
      : 'loading speech models…';
    const llm = s.llm_error ? `replies off: ${s.llm_error}` : `<b>${s.llm}</b>`;
    setStatus(`${stt} · ${llm}`);
    setTimeout(refreshStatus, s.stt_ready && !s.llm_error ? 30000 : 3000);   // picks up the LLM when it appears
  } catch { setStatus('server not reachable'); setTimeout(refreshStatus, 3000); }
}

// --- speaking the reply: each finished sentence is turned into audio on the server (offline) and played
//     in order; the next sentence is prepared while the current one plays ---
const voice = { on: true, gen: 0, queue: [], playing: false, audio: null, el: null };
try { voice.on = localStorage.getItem('voice') !== 'off'; } catch {}
function showVoice() {
  $('voice').textContent = voice.on ? '🔊 Voice on' : '🔇 Voice off';
  $('voice').setAttribute('aria-pressed', String(voice.on));
}
function stopSpeaking() {
  voice.gen++; voice.queue = [];
  if (voice.audio) { voice.audio.pause(); voice.audio = null; }
  voice.playing = false;
  voice.el?.classList.remove('speaking'); voice.el = null;
}
function speak(sentence, language, el) {
  if (!voice.on || !/[\p{L}\p{N}]/u.test(sentence)) return;
  const gen = voice.gen;
  const clip = fetch('/api/speak', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                     body: JSON.stringify({ text: sentence, language }) })
    .then(r => r.status === 200 ? r.blob() : null).catch(() => null);
  voice.queue.push({ clip, gen, el });
  if (!voice.playing) playNext();
}
async function playNext() {
  const item = voice.queue.shift();
  if (!item) { voice.playing = false; voice.el?.classList.remove('speaking'); voice.el = null; return; }
  voice.playing = true;
  const blob = await item.clip;
  if (item.gen !== voice.gen) return;                 // stopped while it was being prepared
  if (!blob) return playNext();
  voice.el = item.el; item.el?.classList.add('speaking');
  const url = URL.createObjectURL(blob);
  const a = new Audio(url); voice.audio = a;
  a.onended = a.onerror = () => { URL.revokeObjectURL(url); if (item.gen === voice.gen) playNext(); };
  a.play().catch(() => playNext());
}
// Sentence ends: . ! ? and the Bangla danda (।), followed by a space; or a line break.
function takeSentences(state, final) {
  const out = [];
  const re = /[.!?।॥]+["')\]]*\s+|\n+/g;
  let m, start = 0;
  while ((m = re.exec(state.buf))) { out.push(state.buf.slice(start, m.index + m[0].length).trim()); start = re.lastIndex; }
  state.buf = state.buf.slice(start);
  if (final && state.buf.trim()) { out.push(state.buf.trim()); state.buf = ''; }
  return out.filter(Boolean);
}

// One request -> a stream of JSON lines: transcript, delta..., done / error.
// The latest spoken message can be re-heard in the other language with one click.
let lastTurn = null;                                   // { wav, els: [...] }
function offerFix(userEl, language, wav, els) {
  document.querySelectorAll('.fix').forEach(b => b.remove());   // only the newest message can be redone
  const other = language === 'bn' ? 'en' : 'bn';
  const b = document.createElement('button');
  b.className = 'fix';
  b.textContent = `wrong language? hear it as ${other === 'bn' ? 'বাংলা' : 'English'}`;
  b.onclick = () => {
    if (busy) return;
    stopSpeaking();
    els.forEach(e => e.remove());
    const form = new FormData();
    form.append('audio', wav, 'speech.wav');
    form.append('language', other);
    form.append('redo', 'true');
    run('/api/talk', { method: 'POST', body: form }, wav);
  };
  userEl.querySelector('.meta')?.appendChild(b);
}

async function run(url, options, wav = null) {
  setBusy(true);
  stopSpeaking();
  document.querySelectorAll('.fix').forEach(b => b.remove());
  let userEl = null, botEl = null, botText = '', replyLang = null;
  const sent = { buf: '' };
  const els = [];
  const origAdd = add;
  const track = (cls, text) => { const e = origAdd(cls, text); els.push(e); return e; };
  try {
    const res = await fetch(url, options);
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let nl;
      while ((nl = buf.indexOf('\n')) >= 0) {
        const line = buf.slice(0, nl); buf = buf.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === 'transcript') {
          if (!ev.text) { track('bot', '(I did not hear any words — try again a little closer to the microphone.)'); continue; }
          userEl = track('user', ev.text);
          replyLang = ev.language;
          meta(userEl, `${ev.language === 'bn' ? 'বাংলা' : 'English'} · heard in ${ev.seconds.toFixed(1)} s`);
          if (wav) offerFix(userEl, ev.language, wav, els);
        } else if (ev.type === 'delta') {
          if (!botEl) botEl = track('bot', '');
          botText += ev.text; botEl.textContent = botText;
          scroller.scrollTop = scroller.scrollHeight;
          sent.buf += ev.text;
          for (const s of takeSentences(sent, false)) speak(s, null, botEl);
        } else if (ev.type === 'done') {
          for (const s of takeSentences(sent, true)) speak(s, null, botEl);
        } else if (ev.type === 'error') {
          track('bot', '⚠ ' + ev.message);
        }
      }
    }
  } catch (e) { add('bot', '⚠ ' + e.message); }
  setBusy(false);
}

// --- recording: raw PCM through an AudioWorklet (no lossy codec), sent as a 16-bit WAV ---
const WORKLET = `class Tap extends AudioWorkletProcessor {
  process(inputs) { const c = inputs[0][0]; if (c) this.port.postMessage(c.slice(0)); return true; } }
registerProcessor('tap', Tap);`;

let starting = false, cancelStart = false;
async function startRec() {
  if (rec || busy || starting) return;
  starting = true; cancelStart = false;
  stopSpeaking();                                      // never record the reply's own voice
  let stream, ctx;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: {
      channelCount: 1, echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    ctx = new AudioContext();
    await ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([WORKLET], { type: 'text/javascript' })));
  } catch (e) {
    stream?.getTracks().forEach(t => t.stop()); ctx?.close(); starting = false;
    add('bot', '⚠ Microphone not available: ' + e.message + ' — allow the microphone for this page in your browser.');
    return;
  }
  starting = false;
  if (cancelStart) { stream.getTracks().forEach(t => t.stop()); ctx.close(); return; }   // released during setup
  const node = new AudioWorkletNode(ctx, 'tap');
  const chunks = [];
  node.port.onmessage = e => {
    chunks.push(e.data);
    let peak = 0; for (const v of e.data) { const a = Math.abs(v); if (a > peak) peak = a; }
    $('level').firstElementChild.style.width = Math.min(100, peak * 300) + '%';
  };
  ctx.createMediaStreamSource(stream).connect(node);
  rec = { stream, ctx, chunks };
  mic.classList.add('rec');
}

async function stopRec() {
  if (starting) { cancelStart = true; return; }
  if (!rec) return;
  const { stream, ctx, chunks } = rec; rec = null;
  mic.classList.remove('rec');
  $('level').firstElementChild.style.width = '0';
  stream.getTracks().forEach(t => t.stop());
  const rate = ctx.sampleRate; await ctx.close();
  const n = chunks.reduce((a, c) => a + c.length, 0);
  if (n < rate * 0.3) return;                       // a stray click
  const wav = new DataView(new ArrayBuffer(44 + n * 2));
  const str = (o, s) => [...s].forEach((ch, i) => wav.setUint8(o + i, ch.charCodeAt(0)));
  str(0, 'RIFF'); wav.setUint32(4, 36 + n * 2, true); str(8, 'WAVEfmt ');
  wav.setUint32(16, 16, true); wav.setUint16(20, 1, true); wav.setUint16(22, 1, true);
  wav.setUint32(24, rate, true); wav.setUint32(28, rate * 2, true); wav.setUint16(32, 2, true);
  wav.setUint16(34, 16, true); str(36, 'data'); wav.setUint32(40, n * 2, true);
  let o = 44;
  for (const c of chunks) for (const v of c) { wav.setInt16(o, Math.max(-1, Math.min(1, v)) * 32767, true); o += 2; }
  const form = new FormData();
  const wavBlob = new Blob([wav], { type: 'audio/wav' });
  form.append('audio', wavBlob, 'speech.wav');
  form.append('language', $('lang').value);
  await run('/api/talk', { method: 'POST', body: form }, wavBlob);
}

mic.onclick = () => rec ? stopRec() : startRec();
let spaceHeld = false;
document.addEventListener('keydown', e => {
  if (e.code !== 'Space' || e.repeat || document.activeElement === $('text')) return;
  e.preventDefault(); spaceHeld = true; startRec();
});
document.addEventListener('keyup', e => {
  if (e.code === 'Space' && spaceHeld) { e.preventDefault(); spaceHeld = false; stopRec(); }
});

function sendText() {
  const t = $('text').value.trim();
  if (!t || busy) return;
  $('text').value = ''; $('text').style.height = 'auto';
  add('user', t);
  run('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: t }) });
}
$('send').onclick = sendText;
$('text').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendText(); } });
$('text').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; });
$('voice').onclick = () => {
  voice.on = !voice.on;
  try { localStorage.setItem('voice', voice.on ? 'on' : 'off'); } catch {}
  if (!voice.on) stopSpeaking();
  showVoice();
};
showVoice();
// A new chat starts like a real call: the agent greets first (spoken when the click allows audio).
async function startCall(speakIt) {
  stopSpeaking();
  let greeting = '';
  try { greeting = (await (await fetch('/api/reset', { method: 'POST' })).json()).greeting || ''; } catch {}
  if (!greeting) {
    log.innerHTML = '<p class="empty" id="empty">New chat. Click the microphone and speak.</p>';
    return;
  }
  log.innerHTML = '';
  const el = add('bot', greeting);
  if (speakIt) speak(greeting, 'bn', el);
}
$('new').onclick = () => startCall(true);
startCall(false);
refreshStatus();
</script>
</body>
</html>
